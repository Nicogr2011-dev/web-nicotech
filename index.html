    <meta charset="UTF-8" />
    <meta name="impact-site-verification" value="c24b2a53-a6f1-4ea9-b072-bd35810b77bd" />
    <script>
      // Aplica el tema antes de que React monte, para evitar un parpadeo de tema
      // claro al cargar si el usuario tiene el oscuro activado (a mano o por sistema).
      (function () {
        var stored = localStorage.getItem("nicotech-theme");
        var dark = stored === "dark" || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <script>
      // La portada viene pre-pintada en el HTML (scripts/prerender.mjs) para los
      // buscadores. En cualquier otra ruta (/#/dashboard…) se oculta al instante
      // para que no asome hasta que React monte la página buena.
      if (location.hash.length > 2) document.documentElement.setAttribute("data-app-route", "");
    </script>
    <style>
      [data-app-route] [data-prerender] { display: none !important; }
    </style>
    <script>
      // Captura beforeinstallprompt lo antes posible: el navegador puede
      // dispararlo antes de que React monte y añada su propio listener,
      // y ese evento no se puede "reintentar" después si te lo pierdes.
      window.__pwaPrompt = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__pwaPrompt = e;
        window.dispatchEvent(new CustomEvent("pwa-install-available"));
      });
    </script>
